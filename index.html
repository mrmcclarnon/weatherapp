<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="weather-container">
        <h1>Current Weather</h1>
        
        <!-- Dynamic Weather Data -->
        <div id="location">Location: Fetching...</div>
        <div id="temperature">Temperature: Loading...</div>
        <div id="wind-speed">Wind Speed: Loading...</div>
        <div id="wind-direction">Wind Direction: Loading...</div>
        
        <!-- Toggle Units -->
        <div id="toggle-units">
            <span>Toggle Units:</span>
            <label class="switch">
                <input type="checkbox" id="unit-toggle" checked>
                <span class="slider round"></span>
            </label>
            <span id="unit-label">Celsius</span>
        </div>
