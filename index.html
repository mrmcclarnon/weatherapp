<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Weather App</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

<div id="weather-container">
<h2>Current Weather</h2>
<p id="location">Location: Fetching...</p>
<p id="temperature">Temperature: 11.1°C</p>
<p id="wind-speed">Wind Speed: 7.2 km/h</p>
<p id="wind-direction">Wind Direction: 31°</p>
<div id="unit-toggle-container">
<label class="glow-text">
Toggle Units: 
<input type="checkbox" id="unit-toggle" checked>
<span id="unit-label">Celsius</span>
</label>
</div>
</div>
</div>   

</section>

</footer>
</body>
</html>
