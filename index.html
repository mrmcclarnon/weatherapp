<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Current Weather</h1>
        <label>
            Toggle Units: 
            <input type="checkbox" id="unit-toggle" checked>
            <span id="unit-label">Celsius</span>
        </label>
    </header>

    <main>
        <section id="current-weather">
            <p id="location">Location: Fetching...</p>
            <p id="temperature">Temperature: Loading...</p>
            <p id="wind-speed">Wind Speed: Loading...</p>
            <p id="wind-direction">Wind Direction: Loading...</p>
            <p id="humidity">Humidity: Loading...</p>
            <img id="weather-icon" src="" alt="Weather Icon" />
        </section>

        <section id="daily-forecast">
            <h2>3-Day Forecast</h2>
            <div id="forecast">
                <div class="forecast-day" id="day-1">
                    <p id="day-1-date"></p>
                    <p id="day-1-temp"></p>
                    <p id="day-1-cloud"></p>
                    <p id="day-1-sunrise"></p>
                    <p id="day-1-sunset"></p>
                    <p id="day-1-desc"></p>
                </div>
                <div class="forecast-day" id="day-2">
                    <p id="day-2-date"></p>
                    <p id="day-2-temp"></p>
                    <p id="day-2-cloud"></p>
                    <p id="day-2-sunrise"></p>
                    <p id="day-2-sunset"></p>
                    <p id="day-2-desc"></p>
                </div>
                <div class="forecast-day" id="day-3">
                    <p id="day-3-date"></p>
                    <p id="day-3-temp"></p>
                    <p id="day-3-cloud"></p>
                    <p id="day-3-sunrise"></p>
                    <p id="day-3-sunset"></p>
                    <p id="day-3-desc"></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Image by Derek Jensen (Tysto) - Self-photographed, Public Domain.</p>
        <p>© 2024 My Weather App. All rights reserved.</p>
    </footer>
</body>
</html>
